version: '3.8'

networks:
  kaminsky-net:
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  victim:
    build: ./victim
    container_name: victim-resolver
    networks:
      kaminsky-net:
        ipv4_address: 172.20.0.10
    cap_add:
      - NET_RAW
      - NET_ADMIN

  auth:
    build: ./auth
    container_name: auth-server
    networks:
      kaminsky-net:
        ipv4_address: 172.20.0.30

  attacker:
    build: ./dns-poisoning-tool
    container_name: attacker
    networks:
      kaminsky-net:
        ipv4_address: 172.20.0.20
    cap_add:
      - NET_RAW      # Required for Scapy to craft raw packets
      - NET_ADMIN    # Required for Scapy to send packets
    privileged: true # Ensures Scapy has full network stack access